name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-old-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: yanovation/delete-old-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: 30
          keep-latest: 5
          dry-run: false